# Publie une version sur CurseForge (et en release GitHub) quand on pousse un tag, ex. v1.1.2.
# À régler une fois : le secret CF_API_KEY du dépôt (jeton d'API CurseForge) et la ligne
# « ## X-Curse-Project-ID: » dans Negoce.toc.
name: Publier

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Si le test échoue, rien n'est publié.
      - name: Test hors jeu
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          lua5.4 outils/test_hors_jeu.lua

      - uses: BigWigsMods/packager@v2
